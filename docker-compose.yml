version: "3.9"

# Single-command environment for the working slice.
# Run: docker compose up --build
# Then: create a form, publish it, and hit /f/:id and /f/:id/submit.

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: webform
      MYSQL_USER: webform
      MYSQL_PASSWORD: webform
    ports:
      - "3306:3306"
    volumes:
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672" # management UI, http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      MYSQL_DSN: "webform:webform@tcp(mysql:3306)/webform?parseTime=true&loc=UTC"
      AMQP_URL: "amqp://guest:guest@rabbitmq:5672/"
      ADDR: ":8080"
    ports:
      - "8080:8080"

  consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile.consumer
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      AMQP_URL: "amqp://guest:guest@rabbitmq:5672/"
      SUBMISSIONS_DSN: "webform:webform@tcp(mysql:3306)/webform"
      USE_CLICKHOUSE: "0"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
